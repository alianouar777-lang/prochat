name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Install build tools
        run: pip install pyinstaller keyring

      - name: Build EXE
        run: pyinstaller --noconfirm --onefile --windowed --name ProChat --hidden-import keyring.backends.Windows app.py

      - name: Check EXE exists
        run: if (!(Test-Path dist\ProChat.exe)) { throw "ProChat.exe not found" }

      - uses: actions/upload-artifact@v4
        with:
          name: ProChat-windows
          path: dist/ProChat.exe
